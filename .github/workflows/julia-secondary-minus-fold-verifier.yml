name: Julia BigFloat secondary minus-one fold verifier

on:
  workflow_dispatch:

concurrency:
  group: julia-secondary-minus-fold-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Measured cost at dps=60 from run 31932398513 (job bigfloat-fold): one
    # BigFloat `corrected_at` is ~5.5 min, so a five-point stencil is ~27 min.
    # Warm-started from the converged fold root, solve_fold is ~26 min, the four
    # stencil audit_fold levels are ~154 min, and the two branch solves are
    # ~60 min: about 240 min total.  The old 150-minute wall could never fit
    # that and killed three consecutive runs, twice discarding a fully solved
    # fold root.  360 min is the GitHub hosted-runner ceiling.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32
        with:
          version: "1.11.9"
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8
      - name: Instantiate locked independent solver stack
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Parse independent fold verifier
        run: julia --project=julia -e 'Meta.parseall(read("julia/verify_secondary_minus_fold.jl", String)); println("secondary fold verifier syntax OK")'
      - name: Solve and verify secondary minus-one fold/nondegeneracy
        run: |
          mkdir -p artifacts
          julia --project=julia julia/verify_secondary_minus_fold.jl \
            experiments/secondary_minus_fold_bigfloat.tsv \
            experiments/secondary_minus_fold_branches_bigfloat.tsv \
            artifacts/secondary-minus-fold-bigfloat.json \
            60 28 18 12 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secondary-minus-fold-bigfloat-${{ github.sha }}
          path: |
            artifacts/secondary-minus-fold-bigfloat.json
            artifacts/secondary-minus-fold-bigfloat.json.partial
          if-no-files-found: warn
          retention-days: 90
