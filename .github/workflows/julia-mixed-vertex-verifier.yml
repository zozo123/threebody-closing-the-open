name: Julia mixed Floquet vertex verifier

on:
  pull_request:
    paths:
      - "julia/verify_reduced.jl"
      - "julia/verify_critical_points.jl"
      - "julia/verify_mixed_vertices.jl"
      - "experiments/mixed_vertex_candidates.tsv"
      - "experiments/mixed_vertex_principal_lower_left.tsv"
      - "experiments/mixed_vertex_secondary_lower_switch.tsv"
      - "experiments/mixed_vertex_principal_lower_right.tsv"
      - ".github/workflows/julia-mixed-vertex-verifier.yml"
  push:
    branches: ["main"]
    paths:
      - "experiments/mixed_vertex_candidates.tsv"
      - "experiments/mixed_vertex_principal_lower_left.tsv"
      - "experiments/mixed_vertex_secondary_lower_switch.tsv"
      - "experiments/mixed_vertex_principal_lower_right.tsv"
      - "julia/verify_mixed_vertices.jl"
      - ".github/workflows/julia-mixed-vertex-verifier.yml"
  workflow_dispatch:
    inputs:
      dps:
        description: "BigFloat decimal precision"
        required: true
        default: "50"
      tol_exp:
        description: "Vern9 tolerance exponent"
        required: true
        default: "25"
      closure_exp:
        description: "Required corrected closure exponent"
        required: true
        default: "18"
      event_exp:
        description: "Required 2-event norm exponent"
        required: true
        default: "12"
      fd_exp:
        description: "Mass finite-difference step exponent"
        required: true
        default: "6"
      max_shift_exp:
        description: "Maximum accepted mass-root shift exponent"
        required: true
        default: "4"

permissions:
  contents: read

jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.11.9"
      - name: Parse independent mixed-vertex verifier
        run: julia -e 'Meta.parseall(read("julia/verify_mixed_vertices.jl", String)); println("Julia mixed-vertex verifier syntax OK")'

  verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: principal-lower-left
            seed_file: experiments/mixed_vertex_principal_lower_left.tsv
            output_file: artifacts/mixed-vertex-principal-lower-left-bigfloat.json
          - label: secondary-lower-switch
            seed_file: experiments/mixed_vertex_secondary_lower_switch.tsv
            output_file: artifacts/mixed-vertex-secondary-lower-switch-bigfloat.json
          - label: principal-lower-right
            seed_file: experiments/mixed_vertex_principal_lower_right.tsv
            output_file: artifacts/mixed-vertex-principal-lower-right-bigfloat.json
    steps:
      - uses: actions/checkout@v7
      - name: Require frozen candidate seed file
        run: test -s "${{ matrix.seed_file }}"
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.11.9"
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - name: Instantiate locked independent solver stack
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Independently solve both mixed Floquet event equations for ${{ matrix.label }}
        env:
          DPS: ${{ inputs.dps || '50' }}
          TOL_EXP: ${{ inputs.tol_exp || '25' }}
          CLOSURE_EXP: ${{ inputs.closure_exp || '18' }}
          EVENT_EXP: ${{ inputs.event_exp || '12' }}
          FD_EXP: ${{ inputs.fd_exp || '6' }}
          MAX_SHIFT_EXP: ${{ inputs.max_shift_exp || '4' }}
        run: |
          mkdir -p artifacts
          julia --project=julia julia/verify_mixed_vertices.jl \
            "${{ matrix.seed_file }}" \
            "${{ matrix.output_file }}" \
            "$DPS" "$TOL_EXP" "$CLOSURE_EXP" "$EVENT_EXP" "$FD_EXP" "$MAX_SHIFT_EXP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-vertex-${{ matrix.label }}-${{ github.sha }}
          path: ${{ matrix.output_file }}
          if-no-files-found: warn
          retention-days: 90
