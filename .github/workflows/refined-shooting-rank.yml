name: Refined shooting-rank candidates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/refine_shooting_rank_candidates.py"
      - "src/threebody_atlas/liao_family.py"
      - ".github/workflows/refined-shooting-rank.yml"
      - "uv.lock"
  push:
    branches: ["main"]
    paths:
      - "scripts/refine_shooting_rank_candidates.py"
      - "src/threebody_atlas/liao_family.py"
      - ".github/workflows/refined-shooting-rank.yml"
      - "uv.lock"

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m py_compile scripts/refine_shooting_rank_candidates.py

  refine:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          uv run --no-sync python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=', got, 'sha256=', hashlib.sha256(raw).hexdigest())
          PY
      - name: Recompute low-rank candidates after tight periodic correction
        run: |
          uv run --no-sync python scripts/refine_shooting_rank_candidates.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/refined-shooting-rank.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: refined-shooting-rank-${{ github.sha }}
          path: artifacts/refined-shooting-rank.json
          if-no-files-found: warn
          retention-days: 90
