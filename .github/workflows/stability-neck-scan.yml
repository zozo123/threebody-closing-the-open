name: Subgrid stability neck scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/scan_stability_neck.py"
      - "scripts/merge_stability_neck_scans.py"
      - "scripts/neck_topology.py"
      - "src/threebody_atlas/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/stability-neck-scan.yml"
  push:
    branches: ["main"]
    paths:
      - "scripts/scan_stability_neck.py"
      - "scripts/merge_stability_neck_scans.py"
      - "scripts/neck_topology.py"
      - "src/threebody_atlas/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/stability-neck-scan.yml"

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  scan:
    name: m1=${{ matrix.m1_min }}..${{ matrix.m1_max }}
    runs-on: ubuntu-latest
    # Cost model, calibrated on run 31932398616: the slowest 7x131 tile took
    # 113.9 min, i.e. 7.45 s per corrected sample.  The m2 window now spans
    # [0.993, 1.012] = 191 samples per m1 line -> 23.7 min per line.  Three
    # lines per tile is 71.1 min, 47% of the 150-minute cap, and 21 lines / 3
    # = 7 tiles, so max-parallel: 7 runs every tile in a single wave.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - tile: "0"
            m1_min: "0.9970"
            m1_max: "0.9972"
          - tile: "1"
            m1_min: "0.9973"
            m1_max: "0.9975"
          - tile: "2"
            m1_min: "0.9976"
            m1_max: "0.9978"
          - tile: "3"
            m1_min: "0.9979"
            m1_max: "0.9981"
          - tile: "4"
            m1_min: "0.9982"
            m1_max: "0.9984"
          - tile: "5"
            m1_min: "0.9985"
            m1_max: "0.9987"
          - tile: "6"
            m1_min: "0.9988"
            m1_max: "0.9990"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          uv run --no-sync python - <<'PY'
          import hashlib
          from pathlib import Path
          raw=Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
          expected='79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=',got,'sha256=',hashlib.sha256(raw).hexdigest())
          PY
      # m2 window.  The secondary lobe is opened by the minus-one U->S wall,
      # which the float64 critical census (V1_FLOAT64_CRITICAL_CENSUS_2026-08-15)
      # localizes at m2=0.9992401 (m1=0.997), m2=1.0023251 (m1=0.998) and
      # m2=1.0080934 (m1=0.999).  Note m2=1.0004182 at m1=0.998 is NOT this wall:
      # the census gives that root orientation S->U, i.e. it *closes* the main
      # lobe (its m1=0.997 and m1=0.999 partners are 0.9951873 and 1.0015853).
      # The old m2-max of 1.006 sat *below* the U->S wall for m1 >= 0.9987, so
      # the second lobe was outside the raster and the merge test was being
      # evaluated on an object the raster did not contain.
      # 1.012 clears the highest in-range wall (1.0080934) by 0.0039066 =~ 39
      # grid steps.
      # m2-min stays at 0.993: the lower edge of the main stable region is the
      # plus-one U->S wall at m2 = 0.9562525 (m1=0.997), 0.9572605 (m1=0.998),
      # 0.9582715 (m1=0.999) -- between 0.0367475 (m1=0.997) and 0.0347285
      # (m1=0.999) below the window.  Reaching it would add ~375 samples per line
      # (566 samples = 70.3 min per line, forcing one line per tile and ~25 h of
      # runner time) and would buy nothing: the merge test needs the *interior*
      # unstable gap between the two lobes, which lies entirely inside
      # [0.993, 1.012].  The bottom truncation is now reported explicitly by
      # any_stable_interval_touches_boundary / truncated_at_m2_min.
      - name: Warm-start one checkpointed ten-times-finer mass tile
        run: |
          uv run --no-sync python scripts/scan_stability_neck.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            "artifacts/stability-neck-tile-${{ matrix.tile }}.json" \
            --m1-min "${{ matrix.m1_min }}" --m1-max "${{ matrix.m1_max }}" \
            --m2-min 0.993 --m2-max 1.012 \
            --step 0.0001 --max-residual 1e-7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stability-neck-tile-${{ matrix.tile }}-${{ github.sha }}
          path: artifacts/stability-neck-tile-${{ matrix.tile }}.json
          if-no-files-found: warn
          retention-days: 90

  merge:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: stability-neck-tile-*-${{ github.sha }}
          path: artifacts/neck-tiles
          merge-multiple: true
      - name: Verify exact tile coverage and freeze the raster
        run: |
          python scripts/merge_stability_neck_scans.py \
            artifacts/stability-neck-scan.json \
            artifacts/neck-tiles/*.json \
            --expected-m1-min 0.997 --expected-m1-max 0.999 \
            --expected-m2-min 0.993 --expected-m2-max 1.012 \
            --step 0.0001
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stability-neck-scan-${{ github.sha }}
          path: artifacts/stability-neck-scan.json
          if-no-files-found: error
          retention-days: 90
