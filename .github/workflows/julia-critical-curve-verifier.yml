name: Julia critical-curve representative verifier

on:
  pull_request:
    paths:
      - "julia/Project.toml"
      - "julia/Manifest.toml"
      - "julia/verify_reduced.jl"
      - "julia/verify_critical_points.jl"
      - "experiments/critical_curve_representatives.tsv"
      - "experiments/critical_curve_lower_plus_one.tsv"
      - "experiments/critical_curve_upper_collision.tsv"
      - ".github/workflows/julia-critical-curve-verifier.yml"
  push:
    branches: ["main"]
    paths:
      - "julia/Project.toml"
      - "julia/Manifest.toml"
      - "julia/verify_reduced.jl"
      - "julia/verify_critical_points.jl"
      - "experiments/critical_curve_representatives.tsv"
      - "experiments/critical_curve_lower_plus_one.tsv"
      - "experiments/critical_curve_upper_collision.tsv"
      - ".github/workflows/julia-critical-curve-verifier.yml"
  workflow_dispatch:
    inputs:
      dps:
        description: "BigFloat decimal precision"
        required: true
        default: "50"
      tol_exp:
        description: "Vern9 tolerance exponent"
        required: true
        default: "25"
      closure_exp:
        description: "Required corrected closure exponent"
        required: true
        default: "18"
      width_exp:
        description: "Final m2 event-bracket width exponent"
        required: true
        default: "8"

permissions:
  contents: read

jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.11.9"
      - name: Parse independent verifier
        run: julia -e 'Meta.parseall(read("julia/verify_critical_points.jl", String)); println("Julia critical verifier syntax OK")'

  verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: lower-plus-one
            seed_file: experiments/critical_curve_lower_plus_one.tsv
            output_file: artifacts/critical-curve-lower-plus-one-bigfloat.json
          - label: upper-trace-collision
            seed_file: experiments/critical_curve_upper_collision.tsv
            output_file: artifacts/critical-curve-upper-trace-collision-bigfloat.json
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.11.9"
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3.1.0
      - name: Instantiate locked independent solver stack
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Reproduce ${{ matrix.label }} independently
        env:
          DPS: ${{ inputs.dps || '50' }}
          TOL_EXP: ${{ inputs.tol_exp || '25' }}
          CLOSURE_EXP: ${{ inputs.closure_exp || '18' }}
          WIDTH_EXP: ${{ inputs.width_exp || '8' }}
          SEED_FILE: ${{ matrix.seed_file }}
          OUTPUT_FILE: ${{ matrix.output_file }}
        run: |
          mkdir -p artifacts
          julia --project=julia julia/verify_critical_points.jl \
            "$SEED_FILE" \
            "$OUTPUT_FILE" \
            "$DPS" "$TOL_EXP" "$CLOSURE_EXP" "$WIDTH_EXP" 5 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-curve-${{ matrix.label }}-${{ github.sha }}
          path: ${{ matrix.output_file }}
          if-no-files-found: warn
          retention-days: 90
