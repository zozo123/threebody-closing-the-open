name: Strongest hammers self-hosted

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Verification lane to run"
        required: true
        type: choice
        options:
          - all
          - bigfloat-critical
          - bigfloat-mixed
          - latest-bifurcationkit
          - capd-validated
        default: all
      dps:
        description: "BigFloat decimal precision"
        required: true
        default: "50"
      capd_box_radius:
        description: "Relative radius for CAPD rigorous initial-state box"
        required: true
        default: "1e-14"

permissions:
  contents: read

jobs:
  critical-bigfloat:
    if: inputs.lane == 'all' || inputs.lane == 'bigfloat-critical'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: lower-plus-one
            seed_file: experiments/critical_curve_lower_plus_one.tsv
            output_file: artifacts/selfhosted-critical-lower-plus-one-bigfloat.json
          - label: upper-trace-collision
            seed_file: experiments/critical_curve_upper_collision.tsv
            output_file: artifacts/selfhosted-critical-upper-trace-collision-bigfloat.json
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.11.9"
      - name: Instantiate exact frozen independent stack
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.precompile(); Pkg.status()'
      - name: Verify ${{ matrix.label }}
        env:
          DPS: ${{ inputs.dps }}
        run: |
          mkdir -p artifacts
          julia --project=julia julia/verify_critical_points.jl \
            "${{ matrix.seed_file }}" \
            "${{ matrix.output_file }}" \
            "$DPS" 25 18 8 5 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfhosted-critical-${{ matrix.label }}-${{ github.sha }}
          path: ${{ matrix.output_file }}
          if-no-files-found: warn
          retention-days: 90

  mixed-bigfloat:
    if: inputs.lane == 'all' || inputs.lane == 'bigfloat-mixed'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: principal-lower-left
            seed_file: experiments/mixed_vertex_principal_lower_left.tsv
            output_file: artifacts/selfhosted-mixed-principal-lower-left-bigfloat.json
          - label: secondary-lower-switch
            seed_file: experiments/mixed_vertex_secondary_lower_switch.tsv
            output_file: artifacts/selfhosted-mixed-secondary-lower-switch-bigfloat.json
          - label: principal-lower-right
            seed_file: experiments/mixed_vertex_principal_lower_right.tsv
            output_file: artifacts/selfhosted-mixed-principal-lower-right-bigfloat.json
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.11.9"
      - name: Instantiate exact frozen independent stack
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.precompile(); Pkg.status()'
      - name: Verify mixed organizer ${{ matrix.label }}
        env:
          DPS: ${{ inputs.dps }}
        run: |
          mkdir -p artifacts
          julia --project=julia julia/verify_mixed_vertices.jl \
            "${{ matrix.seed_file }}" \
            "${{ matrix.output_file }}" \
            "$DPS" 25 18 12 6 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfhosted-mixed-${{ matrix.label }}-${{ github.sha }}
          path: ${{ matrix.output_file }}
          if-no-files-found: warn
          retention-days: 90

  latest-bifurcationkit:
    if: inputs.lane == 'all' || inputs.lane == 'latest-bifurcationkit'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: principal-lower-left
            seed_file: experiments/mixed_vertex_principal_lower_left.tsv
            output_file: artifacts/selfhosted-latest-bk-principal-lower-left.json
          - label: secondary-lower-switch
            seed_file: experiments/mixed_vertex_secondary_lower_switch.tsv
            output_file: artifacts/selfhosted-latest-bk-secondary-lower-switch.json
          - label: principal-lower-right
            seed_file: experiments/mixed_vertex_principal_lower_right.tsv
            output_file: artifacts/selfhosted-latest-bk-principal-lower-right.json
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.12.6"
      - name: Resolve latest independent stack and freeze manifest
        run: |
          julia --project=julia-latest -e 'using Pkg; Pkg.resolve(); Pkg.instantiate(); Pkg.precompile(); Pkg.status()'
          test -s julia-latest/Manifest.toml
      - name: Cross-check mixed organizer ${{ matrix.label }}
        run: |
          mkdir -p artifacts
          julia --project=julia-latest julia-latest/crosscheck_mixed_vertex.jl \
            "${{ matrix.seed_file }}" \
            "${{ matrix.output_file }}"
          cp julia-latest/Project.toml artifacts/selfhosted-latest-bk-Project.toml
          cp julia-latest/Manifest.toml artifacts/selfhosted-latest-bk-Manifest.toml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfhosted-latest-bk-${{ matrix.label }}-${{ github.sha }}
          path: |
            ${{ matrix.output_file }}
            artifacts/selfhosted-latest-bk-Project.toml
            artifacts/selfhosted-latest-bk-Manifest.toml
          if-no-files-found: warn
          retention-days: 90

  capd-validated:
    if: inputs.lane == 'all' || inputs.lane == 'capd-validated'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: principal-lower-left
            seed_file: experiments/mixed_vertex_principal_lower_left.tsv
          - label: secondary-lower-switch
            seed_file: experiments/mixed_vertex_secondary_lower_switch.tsv
          - label: principal-lower-right
            seed_file: experiments/mixed_vertex_principal_lower_right.tsv
    steps:
      - uses: actions/checkout@v7
      - name: Require C++ proof toolchain
        run: |
          command -v git
          command -v cmake
          command -v g++
      - name: Fetch frozen current CAPD master
        run: |
          rm -rf third_party/CAPD
          git clone --filter=blob:none https://github.com/CAPDGroup/CAPD.git third_party/CAPD
          git -C third_party/CAPD checkout 731079217a9254ea2948d742df2b170895effe7f
          test "$(git -C third_party/CAPD rev-parse HEAD)" = "731079217a9254ea2948d742df2b170895effe7f"
      - name: Build CAPD rigorous ODE stack
        run: |
          cmake -S third_party/CAPD -B third_party/CAPD/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCAPD_ENABLE_MULTIPRECISION=false
          cmake --build third_party/CAPD/build --parallel 2
      - name: Build and run rigorous flow enclosure
        env:
          BOX_RADIUS: ${{ inputs.capd_box_radius }}
        run: |
          mkdir -p artifacts
          g++ -O2 -std=c++17 validated/capd/validated_flow.cpp \
            $(third_party/CAPD/build/bin/capd-config --cflags --libs) \
            -o artifacts/capd-validated-flow
          artifacts/capd-validated-flow \
            "${{ matrix.seed_file }}" \
            "artifacts/selfhosted-capd-validated-flow-${{ matrix.label }}.json" \
            "$BOX_RADIUS"
          printf '%s\n' '731079217a9254ea2948d742df2b170895effe7f' > artifacts/CAPD_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfhosted-capd-validated-${{ matrix.label }}-${{ github.sha }}
          path: |
            artifacts/selfhosted-capd-validated-flow-${{ matrix.label }}.json
            artifacts/CAPD_COMMIT.txt
          if-no-files-found: warn
          retention-days: 90
