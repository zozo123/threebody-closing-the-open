name: Family identity audit

on:
  workflow_dispatch:
  push:
    branches: ["agent/research-platform-v1"]
    paths:
      - "scripts/audit_family_identity.py"
      - "research/NOVELTY_AUDIT.md"
      - ".github/workflows/family-identity-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Fetch frozen baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=', got)
          PY
      - name: Recompute invariant diagnostics for all rows
        run: |
          python scripts/audit_family_identity.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/family-identity-diagnostics.csv \
            artifacts/family-identity-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: family-identity-audit-${{ github.sha }}
          path: |
            artifacts/family-identity-diagnostics.csv
            artifacts/family-identity-summary.json
          if-no-files-found: error
          retention-days: 90
