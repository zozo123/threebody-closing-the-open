name: Julia generic daughter verifier

on:
  workflow_dispatch:
    inputs:
      dps:
        description: "BigFloat decimal precision"
        required: true
        default: "50"
      tol_exp:
        description: "Vern9 tolerance exponent"
        required: true
        default: "25"
      target_exp:
        description: "Required generic residual exponent (stricter than the frozen 1e-7 closure gate)"
        required: true
        default: "8"
      min_parent_distance_exp:
        description: "Minimum normalized distance from Li parent exponent"
        required: true
        default: "4"
  pull_request:
    paths:
      - "julia/verify_reduced.jl"
      - "julia/verify_critical_points.jl"
      - "julia/verify_generic_daughters.jl"
      - "scripts/classify_lower_plus_one_daughter.py"
      - "research/evidence/V1_DAUGHTER_STRUCTURAL_2026-08-15.json"
      - "experiments/daughter_d0_plus_reproduction.tsv"
      - "experiments/daughter_d0_minus_reproduction.tsv"
      - "experiments/daughter_d1_plus_reproduction.tsv"
      - ".github/workflows/julia-generic-daughter-verifier.yml"
  push:
    branches: ["main"]
    paths:
      - "julia/verify_generic_daughters.jl"
      - "scripts/classify_lower_plus_one_daughter.py"
      - "research/evidence/V1_DAUGHTER_STRUCTURAL_2026-08-15.json"
      - "experiments/daughter_d0_plus_reproduction.tsv"
      - "experiments/daughter_d0_minus_reproduction.tsv"
      - "experiments/daughter_d1_plus_reproduction.tsv"
      - ".github/workflows/julia-generic-daughter-verifier.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1.11.9"
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - name: Instantiate locked independent solver stack
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Parse independent daughter verifier
        run: julia --project=julia -e 'Meta.parseall(read("julia/verify_generic_daughters.jl", String)); println("generic daughter verifier syntax OK")'
      - name: Independently reproduce the physical soft-direction daughter
        env:
          DPS: ${{ inputs.dps || '50' }}
          TOL_EXP: ${{ inputs.tol_exp || '25' }}
          TARGET_EXP: ${{ inputs.target_exp || '8' }}
          MIN_PARENT_EXP: ${{ inputs.min_parent_distance_exp || '4' }}
        run: |
          mkdir -p artifacts
          julia --project=julia julia/verify_generic_daughters.jl \
            experiments/daughter_d0_minus_reproduction.tsv \
            artifacts/daughter-d0-minus-bigfloat.json \
            "$DPS" "$TOL_EXP" "$TARGET_EXP" "$MIN_PARENT_EXP"
      - name: Freeze the daughter class
        run: |
          python scripts/classify_lower_plus_one_daughter.py \
            artifacts/lower-plus-one-daughter-class.json \
            --structural research/evidence/V1_DAUGHTER_STRUCTURAL_2026-08-15.json \
            --independent artifacts/daughter-d0-minus-bigfloat.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: generic-daughter-d0-minus-${{ github.sha }}
          path: |
            artifacts/daughter-d0-minus-bigfloat.json
            artifacts/lower-plus-one-daughter-class.json
          if-no-files-found: warn
          retention-days: 90
