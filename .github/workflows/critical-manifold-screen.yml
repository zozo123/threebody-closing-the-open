name: Critical manifold screening

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Pseudo-arclength continuation steps per component"
        required: true
        default: "4"
  push:
    paths:
      - "uv.lock"
      - "src/threebody_atlas/critical_manifold.py"
      - "src/threebody_atlas/critical_geometry.py"
      - "src/threebody_atlas/hybrid_critical.py"
      - "src/threebody_atlas/jax_diffrax.py"
      - "scripts/extract_mass_slice_brackets.py"
      - "scripts/trace_critical_components_from_published.py"
      - "tests/test_critical_manifold.py"
      - "tests/test_critical_geometry.py"
      - "tests/test_jax_diffrax.py"
      - ".github/workflows/critical-manifold-screen.yml"

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAX_ENABLE_X64: "1"
      JAX_COMPILATION_CACHE_DIR: "${{ github.workspace }}/.jax-cache"
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - name: Sync locked accelerated environment
        run: uv sync --locked --extra accelerated --group dev
      - name: Critical algebra, geometry, and JAX implementation tests
        run: |
          uv run --no-sync pytest -q \
            tests/test_critical_manifold.py \
            tests/test_critical_geometry.py \
            tests/test_jax_diffrax.py
      - name: Fetch frozen baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          uv run --no-sync python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=', got, 'sha256=', hashlib.sha256(raw).hexdigest())
          PY
      - name: Extract all published S/U transition brackets
        run: |
          uv run --no-sync python scripts/extract_mass_slice_brackets.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/published-transition-brackets.tsv
      - name: Trace critical components with SciPy values and JAX Jacobians
        env:
          STEPS: ${{ inputs.steps || '4' }}
        run: |
          uv run --no-sync python scripts/trace_critical_components_from_published.py \
            artifacts/published-transition-brackets.tsv \
            artifacts/critical-components.json \
            --steps "$STEPS" --arclength-step 2e-3 --derivatives jax-hybrid
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: critical-manifold-screen-${{ github.sha }}
          path: |
            artifacts/published-transition-brackets.tsv
            artifacts/critical-components.json
          if-no-files-found: warn
          retention-days: 90
