name: Critical manifold screening

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of published transition brackets to refine"
        required: true
        default: "8"
      steps:
        description: "Critical-curve continuation steps per component"
        required: true
        default: "4"
  push:
    branches: ["agent/research-platform-v1"]
    paths:
      - "src/threebody_atlas/critical_curve.py"
      - "scripts/refine_mass_slice_brackets.py"
      - "scripts/trace_critical_components.py"
      - ".github/workflows/critical-manifold-screen.yml"

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Fetch frozen baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=', got)
          PY
      - name: Extract coarse transition brackets
        run: |
          python scripts/extract_mass_slice_brackets.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/published-transition-brackets.tsv
      - name: Refine selected mass slices
        env:
          LIMIT: ${{ inputs.limit || '8' }}
        run: |
          python scripts/refine_mass_slice_brackets.py \
            artifacts/published-transition-brackets.tsv \
            artifacts/refined-transition-brackets.json \
            --limit "$LIMIT" --tolerance 2e-7
      - name: Trace connected screening components
        env:
          STEPS: ${{ inputs.steps || '4' }}
        run: |
          python scripts/trace_critical_components.py \
            artifacts/refined-transition-brackets.json \
            artifacts/critical-components.json \
            --steps "$STEPS"
      - uses: actions/upload-artifact@v4
        with:
          name: critical-manifold-screen-${{ github.sha }}
          path: |
            artifacts/published-transition-brackets.tsv
            artifacts/refined-transition-brackets.json
            artifacts/critical-components.json
          if-no-files-found: error
          retention-days: 90
