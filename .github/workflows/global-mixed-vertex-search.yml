name: Direct mixed Floquet vertex search

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/locate_global_mixed_vertices.py"
      - "src/threebody_atlas/hybrid_vertices.py"
      - "src/threebody_atlas/jax_diffrax.py"
      - ".github/workflows/global-mixed-vertex-search.yml"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: ["main"]
    paths:
      - "scripts/locate_global_mixed_vertices.py"
      - "src/threebody_atlas/hybrid_vertices.py"
      - "src/threebody_atlas/jax_diffrax.py"
      - ".github/workflows/global-mixed-vertex-search.yml"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"
  JAX_ENABLE_X64: "1"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Parse direct vertex driver
        run: |
          python -m py_compile scripts/locate_global_mixed_vertices.py
          python -m py_compile src/threebody_atlas/hybrid_vertices.py

  search:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --extra accelerated
      - name: Require JAX x64
        run: |
          uv run --no-sync python - <<'PY'
          import jax
          assert jax.config.x64_enabled
          print("backend=", jax.default_backend(), "x64=", jax.config.x64_enabled)
          PY
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          uv run --no-sync python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=', got, 'sha256=', hashlib.sha256(raw).hexdigest())
          PY
      - name: Extract published transition brackets
        run: |
          uv run --no-sync python scripts/extract_mass_slice_brackets.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/published-transition-brackets.tsv
      - name: Solve alpha=4 beta=4 preimages directly
        run: |
          uv run --no-sync python scripts/locate_global_mixed_vertices.py \
            artifacts/published-transition-brackets.tsv \
            artifacts/global-mixed-vertices.json \
            --stride 10 --keep 10 --max-nfev 40
      - uses: actions/upload-artifact@v4
        with:
          name: direct-mixed-vertices-${{ github.sha }}
          path: artifacts/global-mixed-vertices.json
          if-no-files-found: error
          retention-days: 90
