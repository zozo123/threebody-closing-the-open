name: Active learning round

on:
  workflow_dispatch:
    inputs:
      max_training:
        description: "Published baseline rows used to train the proposal model"
        required: true
        default: "10000"
      trees:
        description: "Extra-trees ensemble size"
        required: true
        default: "128"
      candidates:
        description: "Physics-screened candidates to retain"
        required: true
        default: "12"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/active-learning.yml"
      - "scripts/active_learning_round.py"
      - "src/threebody_atlas/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  propose-and-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --extra ml
      - name: Fetch frozen baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          uv run --no-sync python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=', got, 'sha256=', hashlib.sha256(raw).hexdigest())
          PY
      - name: Train proposal ensemble and send off-grid candidates to shooting/Floquet screening
        env:
          MAX_TRAINING: ${{ inputs.max_training || '10000' }}
          TREES: ${{ inputs.trees || '128' }}
          CANDIDATES: ${{ inputs.candidates || '12' }}
        run: |
          uv run --no-sync python scripts/active_learning_round.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            --max-training "$MAX_TRAINING" \
            --trees "$TREES" \
            --candidates "$CANDIDATES" \
            --output artifacts/active-learning-round.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: active-learning-${{ github.sha }}
          path: artifacts/active-learning-round.json
          if-no-files-found: warn
          retention-days: 90
