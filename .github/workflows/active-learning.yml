name: Active learning round

on:
  workflow_dispatch:
    inputs:
      max_training:
        description: "Published baseline rows used to train the proposal model"
        required: true
        default: "10000"
      trees:
        description: "Extra-trees ensemble size"
        required: true
        default: "128"
      candidates:
        description: "Physics-screened candidates to retain"
        required: true
        default: "12"
  push:
    branches: ["agent/research-platform-v1"]
    paths:
      - ".github/workflows/active-learning.yml"

permissions:
  contents: read

jobs:
  propose-and-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[ml]'
      - name: Fetch frozen baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=', got)
          PY
      - name: Train proposal ensemble and send off-grid candidates to shooting/Floquet screening
        env:
          MAX_TRAINING: ${{ inputs.max_training || '1500' }}
          TREES: ${{ inputs.trees || '24' }}
          CANDIDATES: ${{ inputs.candidates || '3' }}
        run: |
          python scripts/active_learning_round.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            --max-training "$MAX_TRAINING" \
            --trees "$TREES" \
            --candidates "$CANDIDATES" \
            --output artifacts/active-learning-round.json
      - uses: actions/upload-artifact@v4
        with:
          name: active-learning-${{ github.sha }}
          path: artifacts/active-learning-round.json
          if-no-files-found: error
          retention-days: 90
