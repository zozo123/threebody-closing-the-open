name: V1 scientific CI swarm

# Diversified independent attacks on the remaining Gate B objects.
# Official 62-way / 124-way localization farms stay in their own workflows.
# Event 2e-8 and closure 1e-7 are not parameters here.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v1-ci-swarm.yml"
      - ".github/actions/atlas-uv-baseline/action.yml"
      - "scripts/trace_secondary_minus_fold_geometry.py"
      - "scripts/trace_junction_organizer.py"
      - "scripts/scan_stability_neck.py"
      - "scripts/neck_topology.py"
      - "scripts/locate_secondary_right_mixed.py"
      - "scripts/continue_lower_plus_one_daughter.py"
      - "scripts/trace_secondary_critical_loop.py"
      - "scripts/active_learning_round.py"

concurrency:
  group: v1-ci-swarm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"
  JAX_ENABLE_X64: "true"

jobs:
  fold-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - label: fold-0
            seed_m1: "0.996"
            m1_step: "0.00002"
            descent_steps: "20"
            arclength_steps: "40"
          - label: fold-1
            seed_m1: "0.996"
            m1_step: "0.00001"
            descent_steps: "30"
            arclength_steps: "60"
          - label: fold-2
            seed_m1: "0.996"
            m1_step: "0.00003"
            descent_steps: "20"
            arclength_steps: "80"
          - label: fold-3
            seed_m1: "0.9955"
            m1_step: "0.00002"
            descent_steps: "40"
            arclength_steps: "40"
          - label: fold-4
            seed_m1: "0.9965"
            m1_step: "0.000015"
            descent_steps: "24"
            arclength_steps: "50"
          - label: fold-5
            seed_m1: "0.997"
            m1_step: "0.00002"
            descent_steps: "20"
            arclength_steps: "40"
          - label: fold-6
            seed_m1: "0.996"
            m1_step: "0.00002"
            descent_steps: "16"
            arclength_steps: "80"
          - label: fold-7
            seed_m1: "0.9958"
            m1_step: "0.00001"
            descent_steps: "36"
            arclength_steps: "70"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/atlas-uv-baseline
        with:
          extra: "--extra accelerated"
      - name: Trace secondary minus-one fold ${{ matrix.label }}
        run: |
          uv run --no-sync python scripts/trace_secondary_minus_fold_geometry.py \
            artifacts/published-transition-brackets.tsv \
            "artifacts/swarm-fold-${{ matrix.label }}.json" \
            --seed-m1 "${{ matrix.seed_m1 }}" \
            --m1-step "${{ matrix.m1_step }}" \
            --descent-steps "${{ matrix.descent_steps }}" \
            --arclength-steps "${{ matrix.arclength_steps }}" \
            --arclength-step 0.0005 \
            --max-m2-jump 0.004 \
            --reconnect-mass-gap 0.0015 \
            --reconnect-chart-gap 0.02
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: swarm-fold-${{ matrix.label }}-${{ github.sha }}
          path: artifacts/swarm-fold-${{ matrix.label }}.json
          if-no-files-found: warn
          retention-days: 90

  junction:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - label: principal-lower-left-s14-a0015
            center_m1: "0.9295"
            center_m2: "0.8865"
            steps: "14"
            arclength_step: "0.0015"
          - label: principal-lower-left-s28-a0010
            center_m1: "0.9295"
            center_m2: "0.8865"
            steps: "28"
            arclength_step: "0.0010"
          - label: principal-lower-left-s20-a0020
            center_m1: "0.9295"
            center_m2: "0.8865"
            steps: "20"
            arclength_step: "0.0020"
          - label: secondary-birth-s14-a0015
            center_m1: "0.9965"
            center_m2: "0.9605"
            steps: "14"
            arclength_step: "0.0015"
          - label: secondary-birth-s28-a0010
            center_m1: "0.9965"
            center_m2: "0.9605"
            steps: "28"
            arclength_step: "0.0010"
          - label: secondary-birth-s20-a0020
            center_m1: "0.9965"
            center_m2: "0.9605"
            steps: "20"
            arclength_step: "0.0020"
          - label: principal-lower-right-s14-a0015
            center_m1: "1.0495"
            center_m2: "1.1300"
            steps: "14"
            arclength_step: "0.0015"
          - label: principal-lower-right-s28-a0010
            center_m1: "1.0495"
            center_m2: "1.1300"
            steps: "28"
            arclength_step: "0.0010"
          - label: principal-lower-right-s20-a0020
            center_m1: "1.0495"
            center_m2: "1.1300"
            steps: "20"
            arclength_step: "0.0020"
          - label: upper-hh-s14-a0015
            center_m1: "0.8023"
            center_m2: "0.7592"
            steps: "14"
            arclength_step: "0.0015"
          - label: upper-hh-s28-a0010
            center_m1: "0.8023"
            center_m2: "0.7592"
            steps: "28"
            arclength_step: "0.0010"
          - label: upper-hh-s20-a0020
            center_m1: "0.8023"
            center_m2: "0.7592"
            steps: "20"
            arclength_step: "0.0020"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/atlas-uv-baseline
        with:
          extra: "--extra accelerated"
      - name: Trace junction ${{ matrix.label }}
        run: |
          uv run --no-sync python scripts/trace_junction_organizer.py \
            artifacts/published-transition-brackets.tsv \
            "artifacts/swarm-junction-${{ matrix.label }}.json" \
            --center-m1 "${{ matrix.center_m1 }}" \
            --center-m2 "${{ matrix.center_m2 }}" \
            --radius-m1 0.006 \
            --radius-m2 0.035 \
            --steps "${{ matrix.steps }}" \
            --arclength-step "${{ matrix.arclength_step }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: swarm-junction-${{ matrix.label }}-${{ github.sha }}
          path: artifacts/swarm-junction-${{ matrix.label }}.json
          if-no-files-found: warn
          retention-days: 90

  neck-tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - label: neck-a
            m1_min: "0.9970"
            m1_max: "0.9975"
            m2_min: "0.993"
            m2_max: "1.006"
            step: "0.0001"
          - label: neck-b
            m1_min: "0.9976"
            m1_max: "0.9982"
            m2_min: "0.993"
            m2_max: "1.006"
            step: "0.0001"
          - label: neck-c
            m1_min: "0.9983"
            m1_max: "0.9990"
            m2_min: "0.993"
            m2_max: "1.006"
            step: "0.0001"
          - label: neck-west
            m1_min: "0.9950"
            m1_max: "0.9969"
            m2_min: "0.993"
            m2_max: "1.006"
            step: "0.0002"
          - label: neck-east
            m1_min: "0.9991"
            m1_max: "1.0010"
            m2_min: "0.993"
            m2_max: "1.006"
            step: "0.0002"
          - label: sec-birth
            m1_min: "0.9955"
            m1_max: "0.9985"
            m2_min: "0.950"
            m2_max: "0.980"
            step: "0.0002"
          - label: sec-fold
            m1_min: "0.9958"
            m1_max: "0.9972"
            m2_min: "0.948"
            m2_max: "0.968"
            step: "0.0002"
          - label: sec-right-a
            m1_min: "1.0400"
            m1_max: "1.0415"
            m2_min: "1.000"
            m2_max: "1.070"
            step: "0.0002"
          - label: sec-right-b
            m1_min: "1.0416"
            m1_max: "1.0435"
            m2_min: "1.000"
            m2_max: "1.070"
            step: "0.0002"
          - label: pll-a
            m1_min: "0.9270"
            m1_max: "0.9295"
            m2_min: "0.870"
            m2_max: "0.910"
            step: "0.0002"
          - label: pll-b
            m1_min: "0.9296"
            m1_max: "0.9320"
            m2_min: "0.870"
            m2_max: "0.910"
            step: "0.0002"
          - label: plr-a
            m1_min: "1.0470"
            m1_max: "1.0495"
            m2_min: "1.110"
            m2_max: "1.150"
            step: "0.0002"
          - label: plr-b
            m1_min: "1.0496"
            m1_max: "1.0520"
            m2_min: "1.110"
            m2_max: "1.150"
            step: "0.0002"
          - label: upper-hh-a
            m1_min: "0.8005"
            m1_max: "0.8020"
            m2_min: "0.750"
            m2_max: "0.770"
            step: "0.0002"
          - label: upper-hh-b
            m1_min: "0.8021"
            m1_max: "0.8040"
            m2_min: "0.750"
            m2_max: "0.770"
            step: "0.0002"
          - label: lower-plus
            m1_min: "0.7520"
            m1_max: "0.7560"
            m2_min: "0.752"
            m2_max: "0.756"
            step: "0.0002"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/atlas-uv-baseline
        with:
          extract_brackets: "false"
      - name: Scan neck tile ${{ matrix.label }}
        run: |
          uv run --no-sync python scripts/scan_stability_neck.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            "artifacts/swarm-neck-${{ matrix.label }}.json" \
            --m1-min "${{ matrix.m1_min }}" \
            --m1-max "${{ matrix.m1_max }}" \
            --m2-min "${{ matrix.m2_min }}" \
            --m2-max "${{ matrix.m2_max }}" \
            --step "${{ matrix.step }}" \
            --max-residual 1e-7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: swarm-neck-${{ matrix.label }}-${{ github.sha }}
          path: artifacts/swarm-neck-${{ matrix.label }}.json
          if-no-files-found: warn
          retention-days: 90

  secondary-right-walls:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - label: wall-0
            seed_m1: "1.042"
            m1_step: "0.00002"
            steps: "40"
          - label: wall-1
            seed_m1: "1.042"
            m1_step: "0.00002"
            steps: "75"
          - label: wall-2
            seed_m1: "1.0415"
            m1_step: "0.000015"
            steps: "50"
          - label: wall-3
            seed_m1: "1.0425"
            m1_step: "0.000015"
            steps: "50"
          - label: wall-4
            seed_m1: "1.041"
            m1_step: "0.00002"
            steps: "45"
          - label: wall-5
            seed_m1: "1.043"
            m1_step: "0.00001"
            steps: "40"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/atlas-uv-baseline
        with:
          extra: "--extra accelerated"
      - name: Continue secondary-right wall ${{ matrix.label }}
        run: |
          uv run --no-sync python scripts/locate_secondary_right_mixed.py \
            artifacts/published-transition-brackets.tsv \
            "artifacts/swarm-right-${{ matrix.label }}.json" \
            "artifacts/swarm-right-${{ matrix.label }}.tsv" \
            --seed-m1 "${{ matrix.seed_m1 }}" \
            --m1-step "${{ matrix.m1_step }}" \
            --steps "${{ matrix.steps }}" \
            --m2-min 1.0 --m2-max 1.07 \
            --max-m2-jump 0.004
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: swarm-right-${{ matrix.label }}-${{ github.sha }}
          path: |
            artifacts/swarm-right-${{ matrix.label }}.json
            artifacts/swarm-right-${{ matrix.label }}.tsv
          if-no-files-found: warn
          retention-days: 90

  active-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - label: al-0
            max_training: "10000"
            trees: "128"
            candidates: "12"
          - label: al-1
            max_training: "10000"
            trees: "256"
            candidates: "24"
          - label: al-2
            max_training: "20000"
            trees: "128"
            candidates: "16"
          - label: al-3
            max_training: "8000"
            trees: "64"
            candidates: "12"
          - label: al-4
            max_training: "15000"
            trees: "192"
            candidates: "20"
          - label: al-5
            max_training: "12000"
            trees: "96"
            candidates: "18"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/atlas-uv-baseline
        with:
          extra: "--extra ml"
          extract_brackets: "false"
      - name: Active-learning ${{ matrix.label }}
        run: |
          uv run --no-sync python scripts/active_learning_round.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            --max-training "${{ matrix.max_training }}" \
            --trees "${{ matrix.trees }}" \
            --candidates "${{ matrix.candidates }}" \
            --output "artifacts/swarm-${{ matrix.label }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: swarm-${{ matrix.label }}-${{ github.sha }}
          path: artifacts/swarm-${{ matrix.label }}.json
          if-no-files-found: warn
          retention-days: 90

  secondary-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        max_steps: ["80", "120", "160"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/atlas-uv-baseline
      - name: Trace secondary loop ${{ matrix.max_steps }}
        run: |
          uv run --no-sync python scripts/trace_secondary_critical_loop.py \
            artifacts/published-transition-brackets.tsv \
            "artifacts/swarm-loop-${{ matrix.max_steps }}.json" \
            --max-steps "${{ matrix.max_steps }}" --step 0.001
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: swarm-loop-${{ matrix.max_steps }}-${{ github.sha }}
          path: artifacts/swarm-loop-${{ matrix.max_steps }}.json
          if-no-files-found: warn
          retention-days: 90

  daughter:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - label: dtr-0
            steps: "240"
            arclength_step: "0.0015"
            sign: "-1"
          - label: dtr-1
            steps: "360"
            arclength_step: "0.0010"
            sign: "-1"
          - label: dtr-2
            steps: "180"
            arclength_step: "0.0020"
            sign: "-1"
          - label: dtr-3
            steps: "240"
            arclength_step: "0.0015"
            sign: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/atlas-uv-baseline
        with:
          extract_brackets: "false"
      - name: Daughter genealogy ${{ matrix.label }}
        run: |
          uv run --no-sync python scripts/continue_lower_plus_one_daughter.py \
            experiments/critical_curve_representatives.tsv \
            "artifacts/swarm-daughter-${{ matrix.label }}.json" \
            --direction-index 0 \
            --sign "${{ matrix.sign }}" \
            --steps "${{ matrix.steps }}" \
            --arclength-step "${{ matrix.arclength_step }}" \
            --max-residual 3e-7 \
            --distinct-tolerance 2e-5 \
            --reconnect-tolerance 2e-5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: swarm-daughter-${{ matrix.label }}-${{ github.sha }}
          path: artifacts/swarm-daughter-${{ matrix.label }}.json
          if-no-files-found: warn
          retention-days: 90

  julia-mixed-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - label: principal-lower-left
            seed_file: experiments/mixed_vertex_principal_lower_left.tsv
            dps: "60"
            tol_exp: "28"
          - label: secondary-lower-switch
            seed_file: experiments/mixed_vertex_secondary_lower_switch.tsv
            dps: "60"
            tol_exp: "28"
          - label: principal-lower-right
            seed_file: experiments/mixed_vertex_principal_lower_right.tsv
            dps: "60"
            tol_exp: "28"
          - label: principal-lower-left
            seed_file: experiments/mixed_vertex_principal_lower_left.tsv
            dps: "80"
            tol_exp: "32"
          - label: secondary-lower-switch
            seed_file: experiments/mixed_vertex_secondary_lower_switch.tsv
            dps: "80"
            tol_exp: "32"
          - label: principal-lower-right
            seed_file: experiments/mixed_vertex_principal_lower_right.tsv
            dps: "80"
            tol_exp: "32"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1.11.9"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Instantiate locked independent solver stack
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Canonical mixed ${{ matrix.label }} dps=${{ matrix.dps }}
        run: |
          mkdir -p artifacts
          julia --project=julia julia/verify_mixed_vertices_canonical.jl \
            "${{ matrix.seed_file }}" \
            "artifacts/swarm-mixed-canonical-${{ matrix.label }}-dps${{ matrix.dps }}.json" \
            "${{ matrix.dps }}" "${{ matrix.tol_exp }}" 18 12
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: swarm-mixed-canonical-${{ matrix.label }}-dps${{ matrix.dps }}-${{ github.sha }}
          path: artifacts/swarm-mixed-canonical-${{ matrix.label }}-dps${{ matrix.dps }}.json
          if-no-files-found: warn
          retention-days: 90

  julia-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: lower-plus-one
            seed_file: experiments/critical_curve_lower_plus_one.tsv
            dps: "50"
          - label: upper-trace-collision
            seed_file: experiments/critical_curve_upper_collision.tsv
            dps: "50"
          - label: lower-plus-one
            seed_file: experiments/critical_curve_lower_plus_one.tsv
            dps: "80"
          - label: upper-trace-collision
            seed_file: experiments/critical_curve_upper_collision.tsv
            dps: "80"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1.11.9"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Instantiate locked independent solver stack
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Critical curve ${{ matrix.label }} dps=${{ matrix.dps }}
        run: |
          mkdir -p artifacts
          julia --project=julia julia/verify_critical_points.jl \
            "${{ matrix.seed_file }}" \
            "artifacts/swarm-critical-${{ matrix.label }}-dps${{ matrix.dps }}.json" \
            "${{ matrix.dps }}" 25 18 8 5 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: swarm-critical-${{ matrix.label }}-dps${{ matrix.dps }}-${{ github.sha }}
          path: artifacts/swarm-critical-${{ matrix.label }}-dps${{ matrix.dps }}.json
          if-no-files-found: warn
          retention-days: 90

  julia-daughter:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: d0-minus
            seed_file: experiments/daughter_d0_minus_reproduction.tsv
          - label: d0-plus
            seed_file: experiments/daughter_d0_plus_reproduction.tsv
          - label: d1-plus
            seed_file: experiments/daughter_d1_plus_reproduction.tsv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1.11.9"
      - uses: julia-actions/cache@d10a6fd8f31b12404a54613ebad242900567f2b9 # v2
      - name: Instantiate locked independent solver stack
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Generic daughter ${{ matrix.label }}
        run: |
          mkdir -p artifacts
          julia --project=julia julia/verify_generic_daughters.jl \
            "${{ matrix.seed_file }}" \
            "artifacts/swarm-daughter-${{ matrix.label }}-bigfloat.json" \
            50 25 18 4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: swarm-daughter-${{ matrix.label }}-bigfloat-${{ github.sha }}
          path: artifacts/swarm-daughter-${{ matrix.label }}-bigfloat.json
          if-no-files-found: warn
          retention-days: 90
