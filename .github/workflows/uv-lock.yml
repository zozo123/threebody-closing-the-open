name: uv lock

on:
  push:
    paths:
      - "pyproject.toml"
      - ".python-version"
      - ".github/workflows/uv-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
      - name: Resolve reproducible environment
        run: |
          uv --version
          uv python find
          uv lock
          uv lock --check
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- uv.lock && git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "lock Python environment with uv"
          git push origin "HEAD:${GITHUB_REF_NAME}"
