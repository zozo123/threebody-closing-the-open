name: Invariant projection fold audit

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_invariant_projection.py"
      - ".github/workflows/invariant-projection-audit.yml"

permissions:
  contents: read

jobs:
  folds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw=Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
          expected='79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=',got,'sha256=',hashlib.sha256(raw).hexdigest())
          PY
      - name: Compute invariant-map Jacobian and fold set
        run: |
          python scripts/audit_invariant_projection.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/invariant-projection-folds.json \
            --fold-ratio 0.03
      - uses: actions/upload-artifact@v4
        with:
          name: invariant-projection-folds-${{ github.sha }}
          path: artifacts/invariant-projection-folds.json
          if-no-files-found: error
          retention-days: 90
