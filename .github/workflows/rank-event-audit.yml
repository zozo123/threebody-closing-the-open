name: Floquet rank-event structural audit

on:
  push:
    branches:
      - agent/continuous-event-witnesses
    paths:
      - "src/threebody_atlas/floquet_rank_events.py"
      - "tests/test_floquet_rank_events.py"
      - "scripts/audit_minus_one_rank_loss_corridor.py"
      - "scripts/audit_plus_one_rank_jump.py"
      - "scripts/run_rank_event_slice.py"
      - ".github/workflows/rank-event-audit.yml"
  workflow_dispatch:

concurrency:
  group: rank-event-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest -q tests/test_floquet_rank_events.py

  minus-one-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        m1:
          - "1.042"
          - "1.064"
          - "1.066"
          - "1.074"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: Direct -1 rank loss at m1=${{ matrix.m1 }}
        run: |
          mkdir -p artifacts/rank-events
          uv run --no-sync python scripts/run_rank_event_slice.py \
            minus_one \
            research/evidence/V1_FULL_DOMAIN_SIGN_SWEEP_2026-08-16.json \
            "${{ matrix.m1 }}" \
            "artifacts/rank-events/minus-${{ matrix.m1 }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rank-minus-${{ matrix.m1 }}-${{ github.sha }}
          path: artifacts/rank-events/minus-${{ matrix.m1 }}.json
          if-no-files-found: warn
          retention-days: 90

  plus-one-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        m1:
          - "0.930"
          - "0.970"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: Extra +1 rank nullity at m1=${{ matrix.m1 }}
        run: |
          mkdir -p artifacts/rank-events
          uv run --no-sync python scripts/run_rank_event_slice.py \
            plus_one \
            research/evidence/V1_BRACKET_CRITERION_COMPARISON_2026-08-16.json \
            "${{ matrix.m1 }}" \
            "artifacts/rank-events/plus-${{ matrix.m1 }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rank-plus-${{ matrix.m1 }}-${{ github.sha }}
          path: artifacts/rank-events/plus-${{ matrix.m1 }}.json
          if-no-files-found: warn
          retention-days: 90