name: Baseline reproduction

on:
  push:
    branches: ["agent/research-platform-v1"]
    paths: [".github/workflows/baseline-reproduction.yml"]
  workflow_dispatch:
    inputs:
      start:
        description: "1-based first row"
        required: true
        default: "1"
      chunk_size:
        description: "Rows per runner (4 runners are launched)"
        required: true
        default: "25"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Download frozen-source baseline bytes
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('data/raw/non-hierarchical-3b-supplementary_data.txt')
          raw = p.read_bytes()
          git_blob = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          print('bytes=', len(raw), 'git_blob_sha1=', git_blob, 'sha256=', hashlib.sha256(raw).hexdigest())
          if git_blob != expected:
              raise SystemExit(f'baseline source changed: expected git blob {expected}, got {git_blob}')
          PY
      - name: Select row range
        id: range
        env:
          INPUT_START: ${{ inputs.start || '1' }}
          INPUT_CHUNK: ${{ inputs.chunk_size || '5' }}
          SHARD: ${{ matrix.shard }}
        run: |
          start=$((INPUT_START + SHARD * INPUT_CHUNK))
          stop=$((start + INPUT_CHUNK - 1))
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "stop=$stop" >> "$GITHUB_OUTPUT"
      - name: Recompute closure and reduced Floquet stability
        run: |
          python scripts/reproduce_baseline.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            --start ${{ steps.range.outputs.start }} \
            --stop ${{ steps.range.outputs.stop }} \
            --floquet \
            --output artifacts/baseline-${{ steps.range.outputs.start }}-${{ steps.range.outputs.stop }}.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-shard-${{ matrix.shard }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90
