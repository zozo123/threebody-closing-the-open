name: Secondary critical loop screening

on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: "Maximum pseudo-arclength steps"
        required: true
        default: "100"
  push:
    paths:
      - "scripts/trace_secondary_critical_loop.py"
      - "src/threebody_atlas/critical_massplane.py"
      - ".github/workflows/secondary-critical-loop.yml"

permissions:
  contents: read

jobs:
  trace-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw=Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
          expected='79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=',got,'sha256=',hashlib.sha256(raw).hexdigest())
          PY
      - name: Extract published transition brackets
        run: |
          python scripts/extract_mass_slice_brackets.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/published-transition-brackets.tsv
      - name: Trace the secondary lobe boundary through turning points
        env:
          MAX_STEPS: ${{ inputs.max_steps || '100' }}
        run: |
          python scripts/trace_secondary_critical_loop.py \
            artifacts/published-transition-brackets.tsv \
            artifacts/secondary-critical-loop.json \
            --max-steps "$MAX_STEPS" --step 0.001
      - uses: actions/upload-artifact@v4
        with:
          name: secondary-critical-loop-${{ github.sha }}
          path: artifacts/secondary-critical-loop.json
          if-no-files-found: error
          retention-days: 90
