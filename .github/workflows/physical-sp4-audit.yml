name: Physical Sp4 Floquet quotient audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/threebody_atlas/physical_floquet.py"
      - "scripts/audit_physical_sp4.py"
      - "tests/test_physical_floquet.py"
      - ".github/workflows/physical-sp4-audit.yml"
      - "uv.lock"
  push:
    branches: ["main"]
    paths:
      - "src/threebody_atlas/physical_floquet.py"
      - "scripts/audit_physical_sp4.py"
      - "tests/test_physical_floquet.py"
      - ".github/workflows/physical-sp4-audit.yml"
      - "uv.lock"

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: |
          python -m py_compile src/threebody_atlas/physical_floquet.py
          python -m py_compile scripts/audit_physical_sp4.py

  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          uv run --no-sync python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=', got, 'sha256=', hashlib.sha256(raw).hexdigest())
          PY
      - name: Audit E^omega/E physical Floquet quotient
        run: |
          uv run --no-sync python scripts/audit_physical_sp4.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            experiments/critical_curve_representatives.tsv \
            artifacts/physical-sp4-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: physical-sp4-audit-${{ github.sha }}
          path: artifacts/physical-sp4-audit.json
          if-no-files-found: warn
          retention-days: 90
