name: Modernize tooling bootstrap

on:
  push:
    branches: ["agent/modernize-python-julia-tooling"]

permissions:
  contents: write

jobs:
  modernize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install current uv action
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Modernize Python project metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text()
          text = text.replace(
              '[build-system]\nrequires = ["setuptools>=75", "wheel"]\nbuild-backend = "setuptools.build_meta"\n',
              '[build-system]\nrequires = ["uv_build>=0.11.32,<0.13"]\nbuild-backend = "uv_build"\n',
          )
          text = text.replace(
              'description = "Reproducible computation of periodic-orbit families in the planar Newtonian three-body problem"\n',
              'description = "Reproducible computation of periodic-orbit families in the planar Newtonian three-body problem"\nreadme = "README.md"\n',
          )
          text = text.replace('dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]\n', '')
          text = text.replace(
              '[project.scripts]\n',
              '[dependency-groups]\ndev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]\n\n[project.scripts]\n',
          )
          text = text.replace('[tool.setuptools.packages.find]\nwhere = ["src"]\n\n', '')
          text = text.replace('[tool.ruff]\nline-length = 100\n', '[tool.ruff]\nline-length = 100\ntarget-version = "py313"\n')
          text = re.sub(
              r'\[tool\.uv\]\nrequired-version = "[^"]+"(?:\ndefault-groups = \[[^\n]*\])?',
              '[tool.uv]\nrequired-version = ">=0.12.5,<0.13"\ndefault-groups = []',
              text,
          )
          pyproject.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          install = (
              '## Install\n\n'
              'The supported Python runtime is **CPython 3.13**. The Python environment, lockfile, development tools, and package build are managed with `uv`.\n\n'
              '```bash\n'
              'uv python install 3.13\n'
              'uv sync --locked --group dev\n'
              'uv run --no-sync pytest\n'
              'uv run --no-sync ruff check src tests\n'
              '```\n\n'
              'Development-only tools (`pytest`, `ruff`) live in the standardized `dev` dependency group instead of a published package extra. Runtime features remain opt-in extras:\n\n'
              '```bash\n'
              'uv sync --locked --group dev --extra ml\n'
              'uv sync --locked --group dev --extra accelerated\n'
              '```\n\n'
          )
          text, count = re.subn(r'## Install\n.*?(?=## Deterministic numerical smoke test\n)', install, text, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one README install section, replaced {count}')
          text = text.replace(
              '- **CI**: Python 3.11–3.13 tests plus a deterministic Floquet smoke artifact.',
              '- **CI**: uv-locked Python 3.13 tests plus a deterministic Floquet smoke artifact.',
          )
          readme.write_text(text)

          Path('.github/dependabot.yml').write_text(
              'version: 2\n'
              'updates:\n'
              '  - package-ecosystem: "uv"\n'
              '    directory: "/"\n'
              '    schedule:\n'
              '      interval: "weekly"\n'
              '    open-pull-requests-limit: 5\n\n'
              '  - package-ecosystem: "github-actions"\n'
              '    directory: "/"\n'
              '    schedule:\n'
              '      interval: "weekly"\n'
              '    open-pull-requests-limit: 5\n'
          )
          PY
      - name: Refresh and validate locked environment
        run: |
          uv python install 3.13
          uv lock
          uv sync --locked --group dev
          uv run --no-sync ruff check src tests --output-format github
          uv run --no-sync pytest
          uv build --no-sources
          git diff --check
      - name: Commit non-workflow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock README.md .github/dependabot.yml
          git status --short
          git commit -m "Modernize Python project tooling"
          git push origin "HEAD:${GITHUB_REF_NAME}"
