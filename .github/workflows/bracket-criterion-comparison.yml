name: Bracket criterion comparison

# Reproduces, in CI, the difference between the two bracketing criteria on the
# frozen baseline.  Deliberately a *narrow* window: the event-sign criterion pays
# one variational Newton correction plus one monodromy per published row, so a
# full-slice sweep belongs on a workstation.  The window below is the one around
# the organizer where the sign-topology audit falsified Gate B, which is where
# the two criteria are known to disagree.
#
# The full-width run whose output is committed under research/evidence is
# reproduced by dropping --m1/--m2-min/--m2-max and letting the script use its
# default slice set.

on:
  workflow_dispatch:
    inputs:
      m2_min:
        description: "low end of the evaluated m2 window"
        default: "0.870"
      m2_max:
        description: "high end of the evaluated m2 window"
        default: "0.900"
  push:
    paths:
      - "scripts/audit_bracket_criteria.py"
      - "scripts/extract_mass_slice_brackets.py"
      - "src/threebody_atlas/bracket_criteria.py"
      - ".github/workflows/bracket-criterion-comparison.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw=Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
          expected='79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=',got,'sha256=',hashlib.sha256(raw).hexdigest())
          PY
      - name: The default criterion must stay byte-identical to the census gate
        run: |
          python scripts/extract_mass_slice_brackets.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/published-transition-brackets.tsv
          python - <<'PY'
          from pathlib import Path
          rows = Path('artifacts/published-transition-brackets.tsv').read_text().splitlines()
          # 620 data rows plus one header: the exact population the 620-cell
          # census was built from.  Any drift here invalidates every artifact
          # derived from that census.
          if len(rows) != 621:
              raise SystemExit(f'published-label criterion drifted: {len(rows) - 1} brackets, expected 620')
          print('published-label brackets = 620')
          PY
      - name: Compare the two criteria across the organizer window
        run: |
          python scripts/audit_bracket_criteria.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/bracket-criterion-comparison.json \
            --m1 0.925 --m1 0.929 --m1 0.930 \
            --m2-min "${{ inputs.m2_min || '0.870' }}" \
            --m2-max "${{ inputs.m2_max || '0.900' }}" \
            --jobs 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bracket-criterion-comparison-${{ github.sha }}
          path: artifacts/bracket-criterion-comparison.json
          if-no-files-found: error
          retention-days: 90
