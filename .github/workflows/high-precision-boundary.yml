name: High-precision boundary verification

on:
  workflow_dispatch:
    inputs:
      dps:
        description: "BigFloat decimal precision"
        required: true
        default: "80"
      tol_exp:
        description: "Vern9 relative/absolute tolerance exponent"
        required: true
        default: "45"
      closure_exp:
        description: "Required corrected closure exponent"
        required: true
        default: "30"
      width_exp:
        description: "Final m2 bracket width exponent"
        required: true
        default: "12"
  push:
    paths:
      - ".github/workflows/high-precision-boundary.yml"
      - "julia/verify_reduced.jl"
      - "julia/refine_boundaries.jl"
      - "experiments/m1_0p8_boundary_seeds.tsv"

permissions:
  contents: read

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - uses: julia-actions/cache@v2
      - name: Install independent solver stack
        run: julia -e 'using Pkg; Pkg.add(["SciMLBase", "OrdinaryDiffEqVerner"]); Pkg.precompile()'
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=', got, 'sha256=', hashlib.sha256(raw).hexdigest())
          PY
      - name: Independently anchor public rows, validate subgrid seeds, and refine events
        env:
          DPS: ${{ inputs.dps || '50' }}
          TOL_EXP: ${{ inputs.tol_exp || '25' }}
          CLOSURE_EXP: ${{ inputs.closure_exp || '15' }}
          WIDTH_EXP: ${{ inputs.width_exp || '8' }}
        run: |
          julia julia/refine_boundaries.jl \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/m1-0.8-boundaries-bigfloat.json \
            "$DPS" "$TOL_EXP" "$CLOSURE_EXP" "$WIDTH_EXP" \
            experiments/m1_0p8_boundary_seeds.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: bigfloat-boundaries-${{ github.sha }}
          path: artifacts/m1-0.8-boundaries-bigfloat.json
          if-no-files-found: error
          retention-days: 90
