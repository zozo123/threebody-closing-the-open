name: Continuation connectivity spanning-tree audit

on:
  workflow_dispatch:
    inputs:
      substeps:
        description: "Continuation substeps across each adversarial MST edge"
        required: true
        default: "6"
      top_mst:
        description: "Number of globally largest MST chart-jump edges to certify"
        required: true
        default: "20"
  pull_request:
    paths:
      - "scripts/audit_connectivity_graph.py"
      - "scripts/verify_connectivity_bottlenecks.py"
      - ".github/workflows/connectivity-audit.yml"
      - "uv.lock"
  push:
    branches: ["main"]
    paths:
      - "scripts/audit_connectivity_graph.py"
      - "scripts/verify_connectivity_bottlenecks.py"
      - ".github/workflows/connectivity-audit.yml"
      - "uv.lock"

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: |
          python -m py_compile scripts/audit_connectivity_graph.py
          python -m py_compile scripts/verify_connectivity_bottlenecks.py

  certificates:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          uv run --no-sync python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=', got, 'sha256=', hashlib.sha256(raw).hexdigest())
          PY
      - name: Build connected mass-grid MST and expose adversarial links
        env:
          TOP_MST: ${{ inputs.top_mst || '20' }}
        run: |
          uv run --no-sync python scripts/audit_connectivity_graph.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/connectivity-graph.json \
            --global-top "$TOP_MST"
      - name: Certify globally worst and macroscopic MST links bidirectionally
        env:
          SUBSTEPS: ${{ inputs.substeps || '6' }}
          TOP_MST: ${{ inputs.top_mst || '20' }}
        run: |
          uv run --no-sync python scripts/verify_connectivity_bottlenecks.py \
            artifacts/connectivity-graph.json \
            artifacts/connectivity-certificates.json \
            --substeps "$SUBSTEPS" \
            --top-mst "$TOP_MST" \
            --max-residual 2e-7 \
            --match-tolerance 2e-5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: continuation-connectivity-${{ github.sha }}
          path: |
            artifacts/connectivity-graph.json
            artifacts/connectivity-certificates.json
          if-no-files-found: warn
          retention-days: 90
