name: Continuation connectivity audit

on:
  workflow_dispatch:
    inputs:
      substeps:
        description: "Continuation substeps across each balanced graph cut"
        required: true
        default: "8"
  push:
    paths:
      - "scripts/audit_connectivity_graph.py"
      - "scripts/verify_connectivity_bottlenecks.py"
      - ".github/workflows/connectivity-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=', got, 'sha256=', hashlib.sha256(raw).hexdigest())
          PY
      - name: Build shooting-chart adjacency MST and select balanced bottlenecks
        run: |
          python scripts/audit_connectivity_graph.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/connectivity-graph.json
      - name: Forward/reverse continuation across macroscopic graph cuts
        env:
          SUBSTEPS: ${{ inputs.substeps || '6' }}
        run: |
          python scripts/verify_connectivity_bottlenecks.py \
            artifacts/connectivity-graph.json \
            artifacts/connectivity-certificates.json \
            --substeps "$SUBSTEPS" \
            --max-residual 2e-7 \
            --match-tolerance 2e-5
      - uses: actions/upload-artifact@v4
        with:
          name: continuation-connectivity-${{ github.sha }}
          path: |
            artifacts/connectivity-graph.json
            artifacts/connectivity-certificates.json
          if-no-files-found: error
          retention-days: 90
