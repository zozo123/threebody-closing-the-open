name: Precision cross-check

on:
  push:
    branches: ["agent/research-platform-v1"]
    paths:
      - ".github/workflows/precision-crosscheck.yml"
      - "src/threebody_atlas/high_precision_reduced.py"
      - "scripts/precision_crosscheck.py"
  workflow_dispatch:
    inputs:
      dps:
        description: "mpmath decimal precision"
        required: true
        default: "60"
      steps:
        description: "coarse RK4 steps; verifier also runs 2x"
        required: true
        default: "512"

permissions:
  contents: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Fetch frozen baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=', got)
          PY
      - name: Cross-check stable and unstable rows with independent mpmath tangent integration
        env:
          DPS: ${{ inputs.dps || '35' }}
          STEPS: ${{ inputs.steps || '64' }}
        run: |
          python scripts/precision_crosscheck.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            --rows 7 12 \
            --dps "$DPS" \
            --steps "$STEPS" \
            --output artifacts/precision-crosscheck.json
      - uses: actions/upload-artifact@v4
        with:
          name: precision-crosscheck-${{ github.sha }}
          path: artifacts/precision-crosscheck.json
          if-no-files-found: error
          retention-days: 90
