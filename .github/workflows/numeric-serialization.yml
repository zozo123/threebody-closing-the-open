name: Canonical numeric serialization

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: numeric-serialization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check src/threebody_atlas/numeric_evidence.py scripts/build_numeric_evidence_artifacts.py tests/test_numeric_evidence.py
      - run: uv run --no-sync python scripts/build_numeric_evidence_artifacts.py --check
      - run: uv run --no-sync pytest tests/test_numeric_evidence.py

  julia-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1.11.9"
      - name: Instantiate frozen JSON parser
        run: julia --project=julia/numeric_serialization -e 'using Pkg; Pkg.instantiate()'
      - name: Verify canonical cross-language round trips
        run: julia --project=julia/numeric_serialization julia/verify_numeric_evidence.jl
