name: Canonical BigFloat verifier

on:
  workflow_dispatch:
    inputs:
      dps:
        description: "BigFloat decimal precision"
        required: true
        default: "70"
      tol_exp:
        description: "Vern9 tolerance exponent"
        required: true
        default: "35"
  push:
    paths:
      - "julia/canonical_jacobi.jl"
      - "julia/verify_canonical_rows.jl"
      - ".github/workflows/canonical-verifier.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - uses: julia-actions/cache@v2
      - name: Install independent canonical solver stack
        run: julia -e 'using Pkg; Pkg.add(["SciMLBase","OrdinaryDiffEqVerner","GenericSchur"]); Pkg.precompile()'
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=', got, 'sha256=', hashlib.sha256(raw).hexdigest())
          PY
      - name: Verify canonical Hamiltonian structure, spectral labels, and pairing
        env:
          DPS: ${{ inputs.dps || '50' }}
          TOL_EXP: ${{ inputs.tol_exp || '25' }}
        run: |
          julia julia/verify_canonical_rows.jl \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/canonical-bigfloat.json \
            "$DPS" "$TOL_EXP" 7 11 12
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-bigfloat-${{ github.sha }}
          path: artifacts/canonical-bigfloat.json
          if-no-files-found: error
          retention-days: 90
