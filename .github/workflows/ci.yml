name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python --version
      - run: uv run --no-sync ruff check src tests --output-format github
      - run: uv run --no-sync pytest

  science-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run --no-sync threebody-atlas smoke --floquet --output artifacts/figure-eight.json
      - uses: actions/upload-artifact@v4
        with:
          name: figure-eight-screening-${{ github.sha }}
          path: artifacts/figure-eight.json
          if-no-files-found: error
          retention-days: 30

  jax-x64-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --extra accelerated
      - name: Require JAX x64 and Diffrax
        run: |
          uv run --no-sync python - <<'PY'
          import diffrax
          import jax
          import jax.numpy as jnp
          assert jax.config.x64_enabled
          x = jnp.asarray([1.0, 2.0], dtype=jnp.float64)
          assert x.dtype == jnp.float64
          print(
              "jax", jax.__version__,
              "diffrax", diffrax.__version__,
              "backend", jax.default_backend(),
              "x64", jax.config.x64_enabled,
          )
          PY
