name: Invariant non-injectivity continuation bridge

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Continuation steps in each direction"
        required: true
        default: "80"
  push:
    paths:
      - "scripts/verify_invariant_noninjective_bridge.py"
      - ".github/workflows/invariant-bridge.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw=Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
          expected='79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=',got,'sha256=',hashlib.sha256(raw).hexdigest())
          PY
      - name: Walk the non-injective invariant pair forward and reverse
        env:
          STEPS: ${{ inputs.steps || '80' }}
        run: |
          python scripts/verify_invariant_noninjective_bridge.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/invariant-bridge.json \
            --steps "$STEPS" --max-residual 2e-7 --match-tolerance 2e-5
      - uses: actions/upload-artifact@v4
        with:
          name: invariant-bridge-${{ github.sha }}
          path: artifacts/invariant-bridge.json
          if-no-files-found: error
          retention-days: 90
