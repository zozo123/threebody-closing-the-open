name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check src tests --output-format github
      - run: uv run --no-sync pytest
      - name: Build Python distributions
        run: uv build --no-sources
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra
      - name: Build manuscript
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Generate release checksums
        run: |
          cp paper/main.pdf dist/atlas-paper.pdf
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.ref_name }}-${{ github.sha }}
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Three-Body Orbit Atlas ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
