name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/verify_actions_evidence.py"
      - "scripts/build_supply_chain_manifest.py"
      - "src/threebody_atlas/supply_chain.py"
      - "research/provenance/**"
  pull_request:
    paths:
      - "paper/**"
      - "research/DISCOVERY_RELEASE.json"
      - "scripts/build_discovery_release.py"
      - "scripts/build_supply_chain_manifest.py"
      - "scripts/verify_actions_evidence.py"
      - "src/threebody_atlas/discovery.py"
      - "src/threebody_atlas/supply_chain.py"
      - "research/provenance/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: "Publish or refresh a paper-bundle prerelease for this commit"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --group dev
      - name: Verify immutable supply-chain inputs
        run: uv run --no-sync python scripts/build_supply_chain_manifest.py --check
      - run: >-
          uv run --no-sync ruff check
          src tests scripts/build_discovery_release.py scripts/verify_actions_evidence.py
          --output-format github
      - run: uv run --no-sync pytest
      - name: Build Python distributions
        run: uv build --no-sources
      - name: Record executing runner, BLAS, and runtime identities
        run: >-
          uv run --no-sync python scripts/build_supply_chain_manifest.py --check
          --runtime-output dist/environment-runtime.json
      - name: Validate discovery contract and inject paper status
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --validate-only
            --emit-paper-status paper/generated/discovery-release.tex
            --emit-paper-claims paper/generated/discoveries.tex
          )
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            args+=(--require-solved)
          fi
          uv run --no-sync python scripts/build_discovery_release.py "${args[@]}"
      - name: Verify pinned Actions evidence for solved v tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-sync python scripts/verify_actions_evidence.py
          --repository "${GITHUB_REPOSITORY}"
      - name: Install TeX and ZIP tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra zip
      - name: Build manuscript
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Assemble self-contained paper release bundle
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ref_name="paper-preview-${GITHUB_SHA::12}"
          else
            ref_name="${GITHUB_REF_NAME//\//-}"
          fi
          bundle="threebody-atlas-paper-bundle-${ref_name}"
          stage="dist/${bundle}"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          commit_date="$(git show -s --format=%cI HEAD)"

          rm -rf "${stage}"
          mkdir -p "${stage}"

          # Start from the exact tracked repository snapshot so the paper bundle
          # cannot silently omit code, workflows, experiments, tests, or research
          # records needed to understand and reproduce the manuscript.
          git archive --format=tar HEAD | tar -xf - -C "${stage}"

          # Add build products and generated claim-gate material that are
          # intentionally not tracked in git.
          mkdir -p "${stage}/paper/generated"
          cp paper/main.pdf "${stage}/paper/main.pdf"
          cp paper/generated/discovery-release.tex \
            "${stage}/paper/generated/discovery-release.tex"

          cat > "${stage}/BUNDLE_CONTENTS.md" <<'EOF'
          # Three-Body Orbit Atlas paper release bundle

          This archive is a self-contained snapshot for the manuscript release.

          It contains:
          - the compiled manuscript at `paper/main.pdf`;
          - the complete tracked repository snapshot (exact commit in `RELEASE_PROVENANCE.txt`);
          - the LaTeX source and bibliography under `paper/`;
          - the generated discovery-release status injected into the PDF build;
          - the frozen scientific protocol and release records under `research/`;
          - committed experiment inputs/results under `experiments/`;
          - Python/Julia/reproduction code, workflows, tests, and locked environments;
          - `RELEASE_PROVENANCE.txt` and an internal `SHA256SUMS` manifest.

          `paper-preview-*` GitHub releases are explicitly prerelease snapshots and
          do not claim that ATLAS V1 is scientifically solved. A tagged `v*` final
          release is still published only after the discovery manifest validates
          with `--require-solved` and all pinned external Actions evidence is
          revalidated against GitHub metadata.
          EOF

          cat > "${stage}/RELEASE_PROVENANCE.txt" <<EOF
          repository=${GITHUB_REPOSITORY}
          commit=${GITHUB_SHA}
          commit_date=${commit_date}
          ref=${GITHUB_REF}
          ref_name=${GITHUB_REF_NAME}
          workflow=${GITHUB_WORKFLOW}
          workflow_ref=${GITHUB_WORKFLOW_REF}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          paper_pdf=paper/main.pdf
          discovery_manifest=research/DISCOVERY_RELEASE.json
          source_snapshot=git archive HEAD
          EOF

          (
            cd "${stage}"
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

          # Normalize mtimes and archive ordering so identical source/build inputs
          # produce a stable ZIP layout without host-specific ZIP metadata.
          find "${stage}" -exec touch -h -d "@${source_date_epoch}" {} +
          (
            cd dist
            find "${bundle}" -type f -print \
              | LC_ALL=C sort \
              | zip -X -q "${bundle}.zip" -@
          )

          cp paper/main.pdf dist/atlas-paper.pdf
          rm -rf "${stage}"

          test -s "dist/${bundle}.zip"
          test -s dist/atlas-paper.pdf
      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub prerelease for paper-bundle previews
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          tag="paper-preview-${short_sha}"
          title="Three-Body Orbit Atlas paper bundle preview ${short_sha}"
          notes="Paper and reproducibility bundle built from commit ${GITHUB_SHA}. This is a prerelease snapshot of the current research state, not the final solved ATLAS V1 release. The compiled PDF includes the machine-readable discovery status from research/DISCOVERY_RELEASE.json."

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --clobber
          else
            gh release create "${tag}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes "${notes}" \
              --prerelease
          fi
      - name: Publish GitHub release for solved v tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Three-Body Orbit Atlas ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
