name: Canonical graph semantics

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: graph-semantics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  graph-isomorphism:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check src/threebody_atlas/graph_semantics.py scripts/build_graph_semantics_artifacts.py scripts/compare_mechanism_graphs.py tests/test_graph_semantics.py
      - run: uv run --no-sync python scripts/build_graph_semantics_artifacts.py --check
      - run: uv run --no-sync pytest tests/test_graph_semantics.py
