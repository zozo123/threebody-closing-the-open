name: Generate Julia verifier lock

on:
  push:
    branches: ["agent/pin-julia-verifier-env"]
    paths:
      - "julia/Project.toml"
      - ".github/workflows/julia-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: julia-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.9"
      - name: Resolve and instantiate pinned verifier environment
        run: |
          julia --project=julia -e 'using Pkg; Pkg.resolve(); Pkg.instantiate(); Pkg.precompile(); Pkg.status()'
      - name: Commit generated Manifest
        run: |
          test -f julia/Manifest.toml
          if git diff --quiet -- julia/Project.toml julia/Manifest.toml && git ls-files --error-unmatch julia/Manifest.toml >/dev/null 2>&1; then
            echo "Julia verifier lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add julia/Project.toml julia/Manifest.toml
          git commit -m "lock Julia verifier environment"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
