name: Paper

on:
  push:
    paths:
      - "paper/**"
      - "research/DISCOVERY_RELEASE.json"
      - "src/threebody_atlas/discovery.py"
      - "scripts/build_discovery_release.py"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - "research/DISCOVERY_RELEASE.json"
      - "src/threebody_atlas/discovery.py"
      - "scripts/build_discovery_release.py"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate discovery contract and inject status
        run: >-
          python scripts/build_discovery_release.py
          --validate-only
          --emit-paper-status paper/generated/discovery-release.tex
          --emit-paper-claims paper/generated/discoveries.tex
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra
      - name: Build manuscript
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-paper-${{ github.sha }}
          path: |
            paper/main.pdf
            paper/generated/discovery-release.tex
          if-no-files-found: error
          retention-days: 30
