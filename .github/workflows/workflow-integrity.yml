name: Scientific workflow integrity

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: workflow-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  chaos-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check src/threebody_atlas/workflow_integrity.py scripts/build_workflow_chaos_artifacts.py tests/test_workflow_integrity.py
      - run: uv run --no-sync python scripts/build_workflow_chaos_artifacts.py --check
      - run: uv run --no-sync pytest tests/test_workflow_integrity.py
