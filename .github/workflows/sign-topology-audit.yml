name: Sign-topology completeness audit

# WHY THIS WORKFLOW EXISTS
#
# Gate B is held open by sign_topology_clean.  The assembler will not flip
# release_ready until scripts/audit_sign_topology.py reports zero
# missing_critical_curve and zero forbidden_component_flip against the
# committed graph.  Those audits are CPU-hours of float64 shooting, so they
# belong on runners, not on a laptop that can die mid-scan.
#
# FINDINGS ARE NOT BUILD FAILURES.  A missing curve is a scientific result.
# Only a tooling crash fails the job.  Nothing here writes release_ready and
# nothing here edits research/evidence/V1_CRITICAL_GRAPH.json.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "which committed scan suite to re-run"
        default: "both"
        type: choice
        options:
          - both
          - wide
          - crossing
  pull_request:
    paths:
      - "scripts/audit_sign_topology.py"
      - "scripts/combine_graph_roots.py"
      - "scripts/assemble_critical_graph.py"
      - "research/evidence/V1_CRITICAL_GRAPH.json"
      - "research/evidence/V1_SUPPLEMENTAL_EVENT_SIGN_ROOTS_2026-08-16.json"
      - ".github/workflows/sign-topology-audit.yml"
  push:
    paths:
      - "scripts/audit_sign_topology.py"
      - "scripts/combine_graph_roots.py"
      - "research/evidence/V1_CRITICAL_GRAPH.json"
      - "research/evidence/V1_SUPPLEMENTAL_EVENT_SIGN_ROOTS_2026-08-16.json"
      - ".github/workflows/sign-topology-audit.yml"

concurrency:
  group: sign-topology-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  combine-roots:
    name: Concatenate catalog and supplemental roots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: Combine certified roots
        run: |
          mkdir -p artifacts/sign-topology
          uv run --no-sync python scripts/combine_graph_roots.py \
            artifacts/sign-topology/combined-roots.json \
            research/evidence/V1_HYBRID_CRITICAL_ROOTS_2026-08-15.json \
            research/evidence/V1_SUPPLEMENTAL_EVENT_SIGN_ROOTS_2026-08-16.json
      - uses: actions/upload-artifact@v4
        with:
          name: combined-roots-${{ github.sha }}
          path: artifacts/sign-topology/combined-roots.json
          if-no-files-found: error
          retention-days: 30

  audit:
    name: Audit ${{ matrix.suite }}
    needs: combine-roots
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'both' || inputs.suite == matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: wide
            scan_lines: "0.9,0.92,0.94,0.97,1.0,1.04,1.08"
            standoff: "0.004"
            max_gap: "0.08"
            m2_range: "0.86,1.2"
            refine_steps: "5"
          - suite: crossing
            scan_lines: "0.925,0.9295,0.9305"
            standoff: "0.003"
            max_gap: "0.006"
            m2_range: "0.865,0.895"
            refine_steps: "6"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          name: combined-roots-${{ github.sha }}
          path: artifacts/sign-topology
      - name: Run the sign-topology audit
        run: |
          mkdir -p artifacts/sign-topology
          uv run --no-sync python scripts/audit_sign_topology.py \
            --graph research/evidence/V1_CRITICAL_GRAPH.json \
            --roots artifacts/sign-topology/combined-roots.json \
            --output "artifacts/sign-topology/V1_SIGN_TOPOLOGY_${{ matrix.suite }}.json" \
            --scan-lines "${{ matrix.scan_lines }}" \
            --standoff "${{ matrix.standoff }}" \
            --max-gap "${{ matrix.max_gap }}" \
            --m2-range "${{ matrix.m2_range }}" \
            --refine-steps "${{ matrix.refine_steps }}" \
            --max-probes 400 \
            --probe-budget 45
      - name: Summarise violations without failing the job
        if: always()
        run: |
          uv run --no-sync python - <<'PY'
          import json, pathlib, sys
          path = pathlib.Path("artifacts/sign-topology") / f"V1_SIGN_TOPOLOGY_${{ matrix.suite }}.json"
          if not path.exists():
              print("no audit artifact")
              sys.exit(0)
          payload = json.loads(path.read_text())
          print(json.dumps({
              "suite": "${{ matrix.suite }}",
              "violation_counts": payload.get("violation_counts"),
              "probe_summary": payload.get("probe_summary"),
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sign-topology-${{ matrix.suite }}-${{ github.sha }}
          path: artifacts/sign-topology/V1_SIGN_TOPOLOGY_${{ matrix.suite }}.json
          if-no-files-found: warn
          retention-days: 90
