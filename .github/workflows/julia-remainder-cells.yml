name: Julia remainder cell escalate

# One published S/U cell per job. Dispatch only when a 32-way chunk times out
# or after the parent escalate finishes with leftovers. Does not share the
# full-critical-root-localization concurrency group and never auto-runs on
# push, so it cannot cancel the live 620-cell farm. Event 2e-8 stays frozen.

on:
  workflow_dispatch:
    inputs:
      cell_ids:
        description: "Comma-separated published S/U cell ids. Empty uses hybrid missing_cells."
        required: false
        default: ""

concurrency:
  group: julia-remainder-${{ github.ref }}-${{ github.event.inputs.cell_ids }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cells: ${{ steps.plan.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: plan
        env:
          CELL_IDS: ${{ github.event.inputs.cell_ids }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = (os.environ.get("CELL_IDS") or "").strip()
          if raw:
              cells = sorted({int(part) for part in raw.split(",") if part.strip() != ""})
          else:
              hybrid = json.loads(Path("research/evidence/V1_HYBRID_CRITICAL_ROOTS_PARTIAL.json").read_text())
              cells = [int(cell) for cell in hybrid["missing_cells"]]
          if not cells:
              raise SystemExit("no remainder cells to escalate")
          bad = [cell for cell in cells if cell < 0 or cell >= 620]
          if bad:
              raise SystemExit(f"cell ids out of range: {bad[:20]}")
          print(f"remainder_cells={len(cells)} ids={cells}")
          Path(os.environ["GITHUB_OUTPUT"]).write_text(
              "cells=" + json.dumps(cells) + "\n", encoding="utf-8"
          )
          PY

  localize:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        cell: ${{ fromJson(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: "1.11.9"
      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0
      - name: Instantiate locked independent solver stack
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Fetch frozen Li-Li-Liao baseline and extract the cell
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path("data/raw/non-hierarchical-3b-supplementary_data.txt").read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = "79b2963df43e62201c35690bfc22bec166132427"
          if got != expected:
              raise SystemExit(f"baseline source changed: {got}")
          PY
          python scripts/extract_mass_slice_brackets.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/published-transition-brackets.tsv
          python - <<'PY'
          import csv
          from pathlib import Path
          cell = int("${{ matrix.cell }}")
          fields = [
              "cell_id", "m1", "m3", "left_m2", "left_x1", "left_v1", "left_v2", "left_period",
              "right_m2", "right_x1", "right_v1", "right_v2", "right_period",
          ]
          with Path("artifacts/published-transition-brackets.tsv").open(encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle, delimiter="\t"))
          row = rows[cell]
          out = Path(f"artifacts/remainder-cell-{cell}.tsv")
          with out.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields, delimiter="\t", lineterminator="\n")
              writer.writeheader()
              writer.writerow({"cell_id": cell, **{field: row[field] for field in fields if field != "cell_id"}})
          PY
      - name: Independently localize cell ${{ matrix.cell }}
        run: |
          julia --project=julia julia/localize_published_cells.jl \
            "artifacts/remainder-cell-${{ matrix.cell }}.tsv" \
            "artifacts/remainder-cell-${{ matrix.cell }}.json" \
            40 22 12 2e-8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: remainder-cell-${{ matrix.cell }}-${{ github.sha }}
          path: |
            artifacts/remainder-cell-${{ matrix.cell }}.tsv
            artifacts/remainder-cell-${{ matrix.cell }}.json
          if-no-files-found: warn
          retention-days: 90
