name: Discovery release

on:
  push:
    branches: ["main"]
    tags: ["solved-v*"]
    paths:
      - "research/DISCOVERY_RELEASE.json"
      - "research/evidence/V1_CRITICAL_GRAPH.json"
      - "paper/**"
      - "scripts/build_discovery_release.py"
      - "scripts/verify_actions_evidence.py"
      - "src/threebody_atlas/discovery.py"
      - ".github/workflows/discovery-release.yml"
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: >-
          Type the exact solved tag (for example solved-v1.0.0) to TAG THE COMMIT AND
          PUBLISH A PUBLIC GitHub Release asserting that the v1 discovery is solved.
          Leave empty to validate, build and upload artifacts without publishing.
        required: false
        default: ""

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: discovery-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLVED_TAG: ${{ startsWith(github.ref, 'refs/tags/solved-v') && github.ref_name || 'solved-v1.0.0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --group dev
      - name: Lint
        run: >-
          uv run --no-sync ruff check
          src tests scripts/build_discovery_release.py scripts/verify_actions_evidence.py
          scripts/check_manuscript_claims.py
          --output-format github
      - name: Test
        run: uv run --no-sync pytest
      - name: Validate scientific state before manuscript build
        run: uv run --no-sync python scripts/build_discovery_release.py --validate-only
      # Run on the committed tree, before injection overwrites it.  A release is
      # the one place where a hand-forged claim file must never be laundered by
      # the very step that regenerates it.
      - name: Refuse a manuscript that outruns the committed evidence
        run: uv run --no-sync python scripts/check_manuscript_claims.py
      - name: Inject discovery status into manuscript
        run: >-
          uv run --no-sync python scripts/build_discovery_release.py
          --validate-only
          --emit-paper-status paper/generated/discovery-release.tex
          --emit-paper-claims paper/generated/discoveries.tex
          --emit-paper-macros paper/generated/claim-macros.tex
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra
      - name: Build manuscript
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Enforce solved release gate
        run: uv run --no-sync python scripts/build_discovery_release.py --validate-only --require-solved
      - name: Verify pinned Actions evidence against GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-sync python scripts/verify_actions_evidence.py
          --repository "${GITHUB_REPOSITORY}"
      - name: Build Python distributions
        run: uv build --no-sources
      - name: Build discovery dossier
        run: >-
          uv run --no-sync python scripts/build_discovery_release.py
          --output-dir dist/discovery
          --require-solved
      - name: Package release artifacts
        shell: bash
        run: |
          cp paper/main.pdf dist/atlas-paper.pdf
          (cd dist && tar -czf "atlas-discovery-dossier-${GITHUB_REF_NAME:-manual}.tar.gz" discovery)
          find dist -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/SHA256SUMS
      - name: Attest solved scientific release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/atlas-paper.pdf
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/discovery/discovery.json
      - uses: actions/upload-artifact@v4
        with:
          name: solved-discovery-${{ env.SOLVED_TAG }}-${{ github.sha }}
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 365
      # A push to main must never mint a solved tag on its own.  Every gate above
      # this line is a machine check; asserting in public that a named open
      # problem is solved is a human act, so it takes a deliberate dispatch in
      # which the operator retypes the exact tag.
      - name: Tag the exact validated and packaged main commit
        if: >-
          github.ref == 'refs/heads/main'
          && github.event_name == 'workflow_dispatch'
          && inputs.confirm_publish == env.SOLVED_TAG
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git rev-parse --verify "refs/tags/${SOLVED_TAG}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "${SOLVED_TAG}")" = "${GITHUB_SHA}"
          else
            git tag "${SOLVED_TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${SOLVED_TAG}"
          fi
      # Two legitimate publish paths, both human-initiated: a person pushes a
      # solved-v* tag, or a person dispatches this workflow and retypes the tag.
      # The previous unguarded form published on any push to main that cleared
      # --require-solved, so the only thing standing between a green gate and a
      # public "solved" claim was that the gate happened to be red.
      - name: Publish solved discovery release
        if: >-
          startsWith(github.ref, 'refs/tags/solved-v')
          || (github.event_name == 'workflow_dispatch'
              && inputs.confirm_publish == env.SOLVED_TAG)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            dist/atlas-paper.pdf
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/discovery/discovery.json
          )
          if gh release view "${SOLVED_TAG}" >/dev/null 2>&1; then
            gh release upload "${SOLVED_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${SOLVED_TAG}" "${assets[@]}" \
              --title "ATLAS solved discovery ${SOLVED_TAG}" \
              --notes-file dist/discovery/DISCOVERY_SUMMARY.md \
              --verify-tag
          fi
