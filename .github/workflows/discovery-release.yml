name: Discovery release

on:
  push:
    tags: ["solved-v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: discovery-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --group dev
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts/build_discovery_release.py --output-format github
      - name: Test
        run: uv run --no-sync pytest
      - name: Validate scientific state before manuscript build
        run: uv run --no-sync python scripts/build_discovery_release.py --validate-only
      - name: Inject discovery status into manuscript
        run: >-
          uv run --no-sync python scripts/build_discovery_release.py
          --validate-only
          --emit-paper-status paper/generated/discovery-release.tex
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra
      - name: Build manuscript
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Enforce solved release gate
        run: uv run --no-sync python scripts/build_discovery_release.py --validate-only --require-solved
      - name: Build Python distributions
        run: uv build --no-sources
      - name: Build discovery dossier
        run: >-
          uv run --no-sync python scripts/build_discovery_release.py
          --output-dir dist/discovery
          --require-solved
      - name: Package release artifacts
        shell: bash
        run: |
          cp paper/main.pdf dist/atlas-paper.pdf
          (cd dist && tar -czf "atlas-discovery-dossier-${GITHUB_REF_NAME:-manual}.tar.gz" discovery)
          find dist -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/SHA256SUMS
      - name: Attest solved scientific release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/atlas-paper.pdf
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/discovery/discovery.json
      - uses: actions/upload-artifact@v4
        with:
          name: solved-discovery-${{ github.ref_name }}-${{ github.sha }}
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 365
      - name: Publish solved discovery release
        if: startsWith(github.ref, 'refs/tags/solved-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/atlas-paper.pdf \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            dist/discovery/discovery.json \
            --title "ATLAS solved discovery ${GITHUB_REF_NAME}" \
            --notes-file dist/discovery/DISCOVERY_SUMMARY.md \
            --verify-tag
