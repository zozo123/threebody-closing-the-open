name: Stability transition topology audit

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_transition_topology.py"
      - ".github/workflows/transition-topology-audit.yml"

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw=Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
          expected='79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=',got,'sha256=',hashlib.sha256(raw).hexdigest())
          PY
      - name: Extract all published transition brackets
        run: |
          python scripts/extract_mass_slice_brackets.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/published-transition-brackets.tsv
      - name: Reconstruct coarse tracks and classify representative smooth events
        run: |
          python scripts/audit_transition_topology.py \
            artifacts/published-transition-brackets.tsv \
            artifacts/transition-topology.json \
            --link-threshold 0.02
      - uses: actions/upload-artifact@v4
        with:
          name: transition-topology-${{ github.sha }}
          path: artifacts/transition-topology.json
          if-no-files-found: error
          retention-days: 90
