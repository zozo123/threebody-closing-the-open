name: Global Floquet event-network census

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/audit_global_event_network.py"
      - "src/threebody_atlas/critical_manifold.py"
      - "src/threebody_atlas/reduced.py"
      - ".github/workflows/global-event-network.yml"
      - "uv.lock"
  push:
    branches: ["main"]
    paths:
      - "scripts/audit_global_event_network.py"
      - "src/threebody_atlas/critical_manifold.py"
      - "src/threebody_atlas/reduced.py"
      - ".github/workflows/global-event-network.yml"
      - "uv.lock"

permissions:
  contents: read

env:
  UV_PYTHON: "3.13"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m py_compile scripts/audit_global_event_network.py

  census:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          uv run --no-sync python - <<'PY'
          import hashlib
          from pathlib import Path
          raw = Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = '79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=', got, 'sha256=', hashlib.sha256(raw).hexdigest())
          PY
      - name: Extract all published S/U transition brackets
        run: |
          uv run --no-sync python scripts/extract_mass_slice_brackets.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/published-transition-brackets.tsv
      - name: Census all smooth event signs and mechanism junctions
        run: |
          uv run --no-sync python scripts/audit_global_event_network.py \
            artifacts/published-transition-brackets.tsv \
            artifacts/global-event-network.json \
            --link-threshold 0.02 \
            --min-track-points 10 \
            --max-localized-junction-cells 80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-event-network-${{ github.sha }}
          path: artifacts/global-event-network.json
          if-no-files-found: warn
          retention-days: 90
