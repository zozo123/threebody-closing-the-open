name: Nested critical mass-plane screening

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Nested pseudo-arclength steps per component"
        required: true
        default: "12"
  push:
    paths:
      - "src/threebody_atlas/critical_massplane.py"
      - "scripts/trace_critical_massplane.py"
      - ".github/workflows/critical-massplane-screen.yml"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Fetch frozen Li-Li-Liao baseline
        run: |
          mkdir -p data/raw artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/sjtu-liao/three-body/main/non-hierarchical-3b-supplementary_data.txt \
            -o data/raw/non-hierarchical-3b-supplementary_data.txt
          python - <<'PY'
          import hashlib
          from pathlib import Path
          raw=Path('data/raw/non-hierarchical-3b-supplementary_data.txt').read_bytes()
          got=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
          expected='79b2963df43e62201c35690bfc22bec166132427'
          if got != expected:
              raise SystemExit(f'baseline source changed: {got}')
          print('source_git_blob=',got,'sha256=',hashlib.sha256(raw).hexdigest())
          PY
      - name: Extract published transition brackets
        run: |
          python scripts/extract_mass_slice_brackets.py \
            data/raw/non-hierarchical-3b-supplementary_data.txt \
            artifacts/published-transition-brackets.tsv
      - name: Trace smooth events with nested mass-plane pseudo-arclength
        env:
          STEPS: ${{ inputs.steps || '12' }}
        run: |
          python scripts/trace_critical_massplane.py \
            artifacts/published-transition-brackets.tsv \
            artifacts/critical-massplane.json \
            --steps "$STEPS" --step 5e-4
      - uses: actions/upload-artifact@v4
        with:
          name: critical-massplane-${{ github.sha }}
          path: artifacts/critical-massplane.json
          if-no-files-found: error
          retention-days: 90
