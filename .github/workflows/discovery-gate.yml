name: Discovery gate

on:
  push:
    paths:
      - "research/**"
      - "paper/**"
      - "src/threebody_atlas/discovery.py"
      - "scripts/build_discovery_release.py"
      - "tests/test_discovery.py"
      - ".github/workflows/discovery-gate.yml"
      - ".github/workflows/discovery-release.yml"
  pull_request:
    paths:
      - "research/**"
      - "paper/**"
      - "src/threebody_atlas/discovery.py"
      - "scripts/build_discovery_release.py"
      - "tests/test_discovery.py"
      - ".github/workflows/discovery-gate.yml"
      - ".github/workflows/discovery-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --group dev
      - name: Lint discovery release code
        run: uv run --no-sync ruff check src tests scripts/build_discovery_release.py --output-format github
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Validate and freeze discovery-status preview
        run: >-
          uv run --no-sync python scripts/build_discovery_release.py
          --output-dir artifacts/discovery-dossier
          --emit-paper-status paper/generated/discovery-release.tex
          --emit-paper-claims paper/generated/discoveries.tex
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: discovery-status-${{ github.sha }}
          path: |
            artifacts/discovery-dossier/**
            paper/generated/discovery-release.tex
            paper/generated/discoveries.tex
          if-no-files-found: error
          retention-days: 90
