name: Discovery gate

on:
  push:
    paths:
      - "research/**"
      - "paper/**"
      - "src/threebody_atlas/discovery.py"
      - "scripts/build_discovery_release.py"
      - "tests/test_discovery.py"
      - ".github/workflows/discovery-gate.yml"
      - ".github/workflows/discovery-release.yml"
  pull_request:
    paths:
      - "research/**"
      - "paper/**"
      - "src/threebody_atlas/discovery.py"
      - "scripts/build_discovery_release.py"
      - "tests/test_discovery.py"
      - ".github/workflows/discovery-gate.yml"
      - ".github/workflows/discovery-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Lint discovery release code
        run: ruff check src tests scripts/build_discovery_release.py
      - name: Run tests
        run: pytest
      - name: Validate and freeze discovery-status preview
        run: >-
          python scripts/build_discovery_release.py
          --output-dir artifacts/discovery-dossier
          --emit-paper-status paper/generated/discovery-release.tex
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-status-${{ github.sha }}
          path: |
            artifacts/discovery-dossier/**
            paper/generated/discovery-release.tex
          if-no-files-found: error
          retention-days: 90
