[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

[project]
name = "threebody-atlas"
version = "0.1.0"
description = "Reproducible computation of periodic-orbit families in the planar Newtonian three-body problem"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.3,<3",
  "scipy>=1.17,<2",
  "mpmath>=1.3,<2",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.8,<2"]
accelerated = [
  "jax>=0.11,<0.12",
  "diffrax>=0.7.2,<0.8",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[project.scripts]
threebody-atlas = "threebody_atlas.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.uv]
required-version = ">=0.12.5,<0.13"
default-groups = []
